<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Cebamar Yerbas — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" crossorigin="anonymous" />
<style>

  :root{
    --bg:#141F17; --bg-soft:#1B2A1E; --card:#FAF4E3; --card-alt:#F1E7CC;
    --ink:#22301C; --ink-soft:#6B7360; --cream:#F4EFE1; --gold:#C69A2B;
    --gold-soft:#E7C567; --brown:#9C5B33; --green:#3F6B3B; --green-deep:#25401F;
    --red:#B4462F; --line:rgba(34,48,28,0.14);
  }
  *{ box-sizing:border-box; font-family:'Inter', sans-serif; }
  html,body{ margin:0; padding:0; background:var(--bg); min-height:100vh; }
  .serif{ font-family:'Fraunces', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  #app{ max-width:640px; margin:0 auto; padding:24px 16px 96px; }

  .header{ display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .header h1{ color:var(--cream); font-size:20px; font-weight:600; margin:0; line-height:1.2; }
  .header p{ color:var(--gold-soft); font-size:12px; margin:2px 0 0; letter-spacing:.02em; }

  .tabs{ display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; padding-bottom:4px; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:999px;
    font-size:13px; white-space:nowrap; border:1px solid rgba(231,197,103,.27); background:transparent;
    color:var(--gold-soft); cursor:pointer; font-weight:500; transition:.15s; }
  .tab-btn.active{ background:var(--gold); color:var(--green-deep); border-color:var(--gold); font-weight:600; }

  .card{ background:var(--card); border-radius:18px; box-shadow:0 6px 18px rgba(0,0,0,.25); padding:16px; margin-bottom:12px; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; }
  .row-start{ display:flex; align-items:flex-start; justify-content:space-between; }

  .field{ display:flex; flex-direction:column; gap:5px; width:100%; }
  .field span{ color:var(--ink-soft); font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-family:'IBM Plex Mono', monospace; }
  input, select{ background:var(--card-alt); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:9px 12px; font-size:14px; outline:none; width:100%; }
  input:focus, select:focus{ box-shadow:0 0 0 2px rgba(198,154,43,.4); }

  .btn{ border-radius:999px; padding:9px 16px; font-size:13px; font-weight:500; display:inline-flex;
    align-items:center; justify-content:center; gap:6px; cursor:pointer; border:none; transition:.15s; }
  .btn:active{ transform:scale(.96); }
  .btn:disabled{ opacity:.4; pointer-events:none; }
  .btn-primary{ background:var(--green); color:var(--cream); }
  .btn-gold{ background:var(--gold); color:var(--green-deep); }
  .btn-ghost{ background:transparent; color:var(--cream); border:1px solid rgba(231,197,103,.35); }
  .btn-danger{ background:transparent; color:var(--red); border:1px solid rgba(180,70,47,.4); }
  .btn-subtle{ background:var(--card-alt); color:var(--ink); }
  .btn-icon{ background:none; border:none; cursor:pointer; color:var(--ink-soft); padding:4px; }

  .empty{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:44px 20px; color:var(--ink-soft); }
  .empty svg{ opacity:.8; }
  .empty p{ font-size:13px; max-width:240px; margin:0; }

  .banner-error{ display:flex; align-items:center; gap:8px; background:rgba(180,70,47,.15); color:#F0B8A6;
    border-radius:12px; padding:9px 12px; font-size:12px; margin-bottom:14px; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(10,14,10,.6); display:flex; align-items:flex-end;
    justify-content:center; z-index:50; }
  @media(min-width:640px){ .modal-overlay{ align-items:center; } }
  .modal{ width:100%; max-width:420px; background:var(--card); border-radius:24px 24px 0 0; padding:20px;
    max-height:90vh; overflow-y:auto; }
  @media(min-width:640px){ .modal{ border-radius:18px; } }
  .modal h3{ margin:0; color:var(--ink); }

  .stock-num{ font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; }
  .low{ color:var(--red); }
  .ok{ color:var(--green); }

  .seal-hero{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:30px 20px; position:relative; }
  .period-row{ display:flex; gap:8px; margin-bottom:16px; }
  .period-btn{ padding:6px 13px; border-radius:999px; font-size:12px; border:1px solid rgba(231,197,103,.4); background:transparent; color:var(--gold-soft); cursor:pointer; }
  .period-btn.active{ background:var(--gold-soft); color:var(--green-deep); font-weight:600; }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .stat-label{ color:var(--ink-soft); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin:0 0 4px; }
  .stat-value{ font-family:'IBM Plex Mono', monospace; font-size:18px; font-weight:600; color:var(--ink); margin:0; }

  .bar-chart{ display:flex; align-items:flex-end; gap:14px; height:160px; padding-top:10px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; }
  .bar{ width:70%; border-radius:6px 6px 0 0; min-height:2px; }
  .bar-val{ font-size:11px; font-family:'IBM Plex Mono', monospace; color:var(--ink-soft); }
  .bar-name{ font-size:11px; color:var(--ink-soft); text-align:center; }

  .sale-item{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; }
  .divider-row{ display:flex; align-items:center; gap:8px; justify-content:center; }

  /* Catálogo */
  .cat-edit-row{ display:flex; gap:12px; align-items:center; padding:14px; }
  .cat-thumb{ width:56px; height:56px; border-radius:10px; object-fit:cover; background:var(--card-alt); flex-shrink:0; }
  .cat-thumb-empty{ width:56px; height:56px; border-radius:10px; background:var(--card-alt); flex-shrink:0; display:flex;
    align-items:center; justify-content:center; color:var(--ink-soft); border:1.5px dashed var(--line); }
  .cat-info{ flex:1; min-width:0; }
  .cat-name{ margin:0; color:var(--ink); font-weight:600; font-size:14px; }
  .cat-meta{ margin:2px 0 0; color:var(--ink-soft); font-size:12px; }
  .cat-actions{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .file-btn{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .switch{ display:flex; align-items:center; gap:7px; font-size:11px; color:var(--ink-soft); cursor:pointer; user-select:none; }
  .switch input{ width:auto; accent-color:var(--green); }

  .catalog-print{ background:var(--cream); border-radius:16px; padding:22px 18px; }
  .catalog-print-header{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .catalog-print-header h2{ margin:0; color:var(--ink); font-size:19px; }
  .catalog-print-header p{ margin:1px 0 0; color:var(--brown); font-size:11px; letter-spacing:.04em; }
  .catalog-note{ background:var(--card-alt); border-radius:10px; padding:8px 12px; font-size:12.5px; color:var(--ink);
    margin:12px 0 4px; }
  .catalog-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .catalog-card{ background:var(--card); border-radius:14px; overflow:hidden; border:1px solid var(--line); }
  .catalog-card-img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--card-alt); }
  .catalog-card-img-empty{ width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); background:var(--card-alt); }
  .catalog-card-body{ padding:9px 10px 11px; }
  .catalog-card-name{ margin:0; font-size:12.5px; font-weight:600; color:var(--ink); line-height:1.2; }
  .catalog-card-price{ margin:4px 0 0; font-family:'IBM Plex Mono', monospace; font-size:14px; font-weight:600; color:var(--brown); }
  .badge{ display:inline-block; margin-top:5px; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:600; letter-spacing:.02em; }
  .badge-ok{ background:rgba(63,107,59,.15); color:var(--green); }
  .badge-out{ background:rgba(180,70,47,.15); color:var(--red); }
  .catalog-footer{ margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); text-align:center; }
  .catalog-footer p{ margin:0; color:var(--ink-soft); font-size:11px; }
</style>

<script>

------------------------------------------------------------------*/
const FIREBASE_CONFIG = {

  authDomain: "cebamar-yerbas.firebaseapp.com",

let db = null;
function firebaseReady() {
  return !!FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.includes("PEGAR");
}
function initFirebase() {
  if (!firebaseReady()) return false;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    return true;
  } catch { return false; }
}
const PRODUCTS_KEY = "cebamar-products";
const SALES_KEY = "cebamar-sales";
const UNITS = ["kg", "paquete", "unidad"];

const DEFAULT_PRODUCTS = [
  { id: "rei-verde", name: "Reí Verde", unit: "kg", costPrice: 0, salePrice: 0, stock: 0, image: null, inCatalog: true },
  { id: "rei-verde-premium", name: "Reí Verde Premium", unit: "kg", costPrice: 0, salePrice: 0, stock: 0, image: null, inCatalog: true },
  { id: "baldo", name: "Baldo", unit: "kg", costPrice: 0, salePrice: 0, stock: 0, image: null, inCatalog: true },
];

const money = (n) => (Number(n) || 0).toLocaleString("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });
const numFmt = (n, d = 2) => { const v = Number(n) || 0; return v % 1 === 0 ? String(v) : v.toFixed(d); };
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function loadJSON(key, fallback) {
  if (!db) return fallback;
  try {
    const snap = await db.collection("cebamar").doc(key).get();
    return snap.exists ? snap.data().value : fallback;
  } catch { return fallback; }
}
async function saveJSON(key, value) {
  if (!db) return false;
  try {
    await db.collection("cebamar").doc(key).set({ value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    return true;
  } catch { return false; }
}
function isInPeriod(iso, period) {
  const d = new Date(iso), now = new Date();
  if (period === "all") return true;
  if (period === "today") return d.toDateString() === now.toDateString();
  if (period === "week") { const diff = (now - d) / 864e5; return diff >= 0 && diff < 7; }
  if (period === "month") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  return true;
}

/* ---------------------------- Icons (inline SVG, stroke-based) ---------------------------- */
const ICONS = {
  package: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>`,

  cart: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>`,
  trend: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>`,
  plus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`,
  x: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`,
  pencil: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`,
  trash: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  alert: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`,
  image: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>`,
  imagePlain: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>`,
  upload: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>`,
  download: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>`,
  file: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>`,
};

function compressImage(file, maxDim = 640, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
          else { width = Math.round((width * maxDim) / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function generateCatalogImage() {
  const node = document.getElementById("catalog-print");
  if (!node || typeof html2canvas === "undefined") {
    alert("No se pudo cargar el generador de imágenes. Revisá tu conexión y probá de nuevo.");
    return;
  }
  state.ui.generating = true; render();
  try {
    const canvas = await html2canvas(node, { scale: 2, backgroundColor: "#F4EFE1", useCORS: true });
    state.ui.catalogImage = canvas.toDataURL("image/png");
  } catch (err) {
    alert("No se pudo generar la imagen. Probá de nuevo.");
  } finally {
    state.ui.generating = false; render();
  }
}

function seal(size, pathId, tone, textColor, center) {
  return `
  <svg viewBox="0 0 200 200" width="${size}" height="${size}" style="overflow:visible">
    <defs><path id="${pathId}" d="M 100,100 m -74,0 a 74,74 0 1,1 148,0 a 74,74 0 1,1 -148,0" /></defs>
    <circle cx="100" cy="100" r="94" fill="none" stroke="${tone}" stroke-width="1.4" stroke-dasharray="1.5 5" />
    <circle cx="100" cy="100" r="79" fill="none" stroke="${tone}" stroke-width="1" opacity="0.6" />
    <text font-size="11.5" letter-spacing="3.2" fill="${tone}" font-family="'IBM Plex Mono', monospace">
      <textPath href="#${pathId}" startOffset="1%">CEBAMAR • YERBAS • MAR DEL PLATA •</textPath>
    </text>
    <text x="100" y="114" text-anchor="middle" font-size="46" font-family="'Fraunces', serif" font-weight="600" fill="${textColor}">${center}</text>
  </svg>`;
}
function leafDivider() {
  return `<svg width="30" height="14" viewBox="0 0 30 14" fill="none" style="opacity:.55">
    <path d="M2 12C10 2 20 2 28 12" stroke="var(--gold)" stroke-width="1.2"/>
    <path d="M15 12V4" stroke="var(--gold)" stroke-width="1.2"/></svg>`;
}
function emptyState(icon, text) {
  return `<div class="empty">${ICONS[icon]}<p>${esc(text)}</p></div>`;
}

/* ---------------------------- State ---------------------------- */
let state = {
  loading: true,
  saveError: false,
  firebaseConnected: false,
  products: [],
  sales: [],
  tab: "stock",
  ui: { modal: null, addingStockFor: null, saleProductId: null, gananciasPeriod: "month", catalogNote: "", generating: false, catalogImage: null },
};

async function persistProducts(next) {
  state.products = next;
  const ok = await saveJSON(PRODUCTS_KEY, next);
  state.saveError = !ok;
  render();
}
async function persistSales(next) {
  state.sales = next;
  const ok = await saveJSON(SALES_KEY, next);
  state.saveError = !ok;
  render();
}

function upsertProduct(p) {
  const exists = state.products.some((x) => x.id === p.id);
  const next = exists ? state.products.map((x) => (x.id === p.id ? p : x)) : [...state.products, p];
  persistProducts(next);
}
function deleteProduct(id) { persistProducts(state.products.filter((p) => p.id !== id)); }
function addStock(id, qty) { persistProducts(state.products.map((p) => (p.id === id ? { ...p, stock: Number(p.stock) + Number(qty) } : p))); }

function registerSale({ productId, quantity, unitPrice }) {
  const product = state.products.find((p) => p.id === productId);
  if (!product || quantity <= 0 || quantity > Number(product.stock)) return false;
  const total = quantity * unitPrice;
  const profit = (unitPrice - Number(product.costPrice)) * quantity;
  const sale = { id: uid(), productId, productName: product.name, unit: product.unit, quantity, unitPrice, unitCost: Number(product.costPrice), total, profit, date: new Date().toISOString() };
  state.sales = [sale, ...state.sales];
  state.products = state.products.map((p) => (p.id === productId ? { ...p, stock: Number(p.stock) - quantity } : p));
  Promise.all([saveJSON(SALES_KEY, state.sales), saveJSON(PRODUCTS_KEY, state.products)]).then(([a, b]) => { state.saveError = !(a && b); render(); });
  return true;
}
function deleteSale(saleId) {
  const sale = state.sales.find((s) => s.id === saleId);
  if (!sale) return;
  state.sales = state.sales.filter((s) => s.id !== saleId);
  state.products = state.products.map((p) => (p.id === sale.productId ? { ...p, stock: Number(p.stock) + sale.quantity } : p));
  Promise.all([saveJSON(SALES_KEY, state.sales), saveJSON(PRODUCTS_KEY, state.products)]).then(([a, b]) => { state.saveError = !(a && b); render(); });
}

/* ---------------------------- Tab renderers ---------------------------- */
function renderStockTab() {
  const products = state.products;
  let html = `<div class="row-between" style="margin-bottom:12px;">
    <p style="color:var(--gold-soft);font-size:12px;margin:0;">${products.length} producto${products.length !== 1 ? "s" : ""}</p>
    <button class="btn btn-gold" data-action="open-new-product">${ICONS.plus} Nuevo producto</button>
  </div>`;

  if (products.length === 0) html += emptyState("package", "Todavía no cargaste ningún producto.");

  products.forEach((p) => {
    const low = Number(p.stock) <= 3;
    const adding = state.ui.addingStockFor === p.id;
    html += `<div class="card">
      <div class="row-start">
        <div><p class="serif" style="margin:0;font-weight:600;color:var(--ink);font-size:16px;">${esc(p.name)}</p>
        <p style="margin:2px 0 0;color:var(--ink-soft);font-size:12px;">${esc(p.unit)}</p></div>
        <div style="text-align:right;">
          <p class="stock-num ${low ? "low" : "ok"}" style="margin:0;">${numFmt(p.stock)}</p>
          <p style="margin:0;color:var(--ink-soft);font-size:10px;text-transform:uppercase;letter-spacing:.05em;">en stock</p>
        </div>
      </div>
      ${low ? `<p style="color:var(--red);font-size:11px;margin:6px 0 0;display:flex;align-items:center;gap:4px;">${ICONS.alert} Stock bajo</p>` : ""}
      <div style="display:flex;align-items:center;gap:8px;margin-top:12px;">
        ${adding ? `
          <input type="number" step="0.5" placeholder="Cantidad (${esc(p.unit)})" id="stockqty-${p.id}" style="max-width:150px;" />
          <button class="btn btn-primary" data-action="confirm-add-stock" data-id="${p.id}">Cargar</button>
          <button class="btn btn-subtle" data-action="cancel-add-stock">${ICONS.x}</button>
        ` : `
          <button class="btn btn-subtle" data-action="open-add-stock" data-id="${p.id}">${ICONS.plus} Cargar stock</button>
          <button class="btn btn-subtle" data-action="edit-product" data-id="${p.id}">${ICONS.pencil}</button>
          <button class="btn btn-danger" data-action="delete-product" data-id="${p.id}">${ICONS.trash}</button>
        `}
      </div>
    </div>`;
  });
  return html;
}

function renderPreciosTab() {
  const products = state.products;
  if (products.length === 0) return emptyState("leaf", "Cargá productos en la pestaña Stock para fijarles precio.");
  return products.map((p) => {
    const margin = p.salePrice > 0 ? (((p.salePrice - p.costPrice) / p.salePrice) * 100) : 0;
    const suggestedMarkup = p.costPrice > 0 ? (((p.salePrice - p.costPrice) / p.costPrice) * 100).toFixed(0) : "";
    return `<div class="card">
      <div class="row-between" style="margin-bottom:10px;">
        <p class="serif" style="margin:0;font-weight:600;color:var(--ink);">${esc(p.name)}</p>
        <span class="mono" style="font-size:12px;color:${margin >= 0 ? "var(--green)" : "var(--red)"};">margen ${margin.toFixed(0)}%</span>
      </div>
      <p style="margin:0 0 8px;color:var(--ink-soft);font-size:11px;">Cargá el costo y la ganancia que querés sobre ese costo — el precio de venta se calcula solo. También lo podés escribir directo.</p>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
        <div class="field" style="min-width:88px;flex:1;"><span>Costo / ${esc(p.unit)}</span><input type="number" id="cost-${p.id}" value="${p.costPrice}" /></div>
        <div class="field" style="min-width:88px;flex:1;"><span>Ganancia %</span><input type="number" id="margin-${p.id}" placeholder="Ej: 30" value="${suggestedMarkup}" /></div>
        <div class="field" style="min-width:88px;flex:1;"><span>Venta / ${esc(p.unit)}</span><input type="number" id="sale-${p.id}" value="${p.salePrice}" /></div>
        <button class="btn btn-gold" data-action="save-price" data-id="${p.id}">Guardar</button>

}

function renderVentasTab() {
  const sellable = state.products.filter((p) => Number(p.stock) > 0);
  if (!state.ui.saleProductId && sellable.length) state.ui.saleProductId = sellable[0].id;
  const product = state.products.find((p) => p.id === state.ui.saleProductId);

  if (sellable.length === 0) {

      <div class="field" style="margin-bottom:10px;">
        <span>Producto</span>
        <select id="sale-product">
          ${sellable.map((p) => `<option value="${p.id}" ${p.id === product.id ? "selected" : ""}>${esc(p.name)} — ${numFmt(p.stock)} ${esc(p.unit)} disp.</option>`).join("")}
        </select>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:10px;">
        <div class="field"><span>Cantidad (${esc(product.unit)})</span><input type="number" step="0.5" id="sale-qty" /></div>
        <div class="field"><span>Precio unitario</span><input type="number" id="sale-price" value="${product.salePrice}" /></div>
      </div>

        <span class="mono" id="sale-total" style="font-weight:600;color:var(--ink);">${money(0)}</span>

    `;

  const salesListHtml = state.sales.length === 0
    ? emptyState("cart", "Todavía no registraste ninguna venta.")
    : state.sales.slice(0, 25).map((s) => `
      <div class="card sale-item">
        <div><p style="margin:0;font-size:14px;font-weight:500;color:var(--ink);">${esc(s.productName)}</p>
        <p style="margin:0;font-size:11px;color:var(--ink-soft);">${numFmt(s.quantity)} ${esc(s.unit)} · ${new Date(s.date).toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</p></div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="mono" style="font-size:14px;font-weight:600;color:var(--green);">${money(s.total)}</span>
          <button class="btn-icon" data-action="delete-sale" data-id="${s.id}">${ICONS.trash}</button>

  return `
    <div class="card">
      <p class="serif" style="margin:0 0 12px;font-weight:600;color:var(--ink);">Registrar venta</p>
      ${formHtml}
    </div>
    <p style="color:var(--gold-soft);font-size:12px;margin:0 0 8px;">Últimas ventas</p>
    ${salesListHtml}
  `;
}

function renderGananciasTab() {
  const period = state.ui.gananciasPeriod;
  const filtered = state.sales.filter((s) => isInPeriod(s.date, period));
  const totals = filtered.reduce((acc, s) => { acc.revenue += s.total; acc.cost += s.unitCost * s.quantity; acc.profit += s.profit; return acc; }, { revenue: 0, cost: 0, profit: 0 });

  const byProductMap = {};
  filtered.forEach((s) => { byProductMap[s.productName] = (byProductMap[s.productName] || 0) + s.profit; });
  const byProduct = Object.entries(byProductMap).map(([name, profit]) => ({ name, profit: Math.round(profit) }));
  const maxAbs = Math.max(1, ...byProduct.map((b) => Math.abs(b.profit)));

  const periods = [["today", "Hoy"], ["week", "7 días"], ["month", "Este mes"], ["all", "Todo"]];

  let chartHtml;
  if (byProduct.length === 0) {
    chartHtml = emptyState("trend", "Todavía no hay ventas en este período.");
  } else {
    chartHtml = `<div class="card">
      <p class="serif" style="margin:0 0 6px;font-weight:600;color:var(--ink);">Ganancia por producto</p>
      <div class="bar-chart">
        ${byProduct.map((b) => `
          <div class="bar-col">
            <span class="bar-val">${money(b.profit)}</span>
            <div class="bar" style="height:${Math.max(4, (Math.abs(b.profit) / maxAbs) * 120)}px;background:${b.profit >= 0 ? "var(--green)" : "var(--red)"};"></div>
            <span class="bar-name">${esc(b.name)}</span>
          </div>`).join("")}
      </div>
    </div>`;
  }

  return `
    <div class="period-row">
      ${periods.map(([id, label]) => `<button class="period-btn ${period === id ? "active" : ""}" data-action="set-period" data-period="${id}">${label}</button>`).join("")}
    </div>
    <div class="card seal-hero">
      ${seal(110, "sealHero", "var(--brown)", "var(--ink)", "$")}
      <div class="divider-row" style="margin-top:10px;">
        ${leafDivider()}<p style="color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:0;">Ganancia neta</p>${leafDivider()}
      </div>
      <p class="serif" style="font-size:34px;font-weight:600;margin:4px 0 0;color:${totals.profit >= 0 ? "var(--green)" : "var(--red)"};">${money(totals.profit)}</p>
    </div>
    <div class="stat-grid">
      <div class="card" style="margin:0;"><p class="stat-label">Ingresos</p><p class="stat-value">${money(totals.revenue)}</p></div>
      <div class="card" style="margin:0;"><p class="stat-label">Costos</p><p class="stat-value">${money(totals.cost)}</p></div>
    </div>
    ${chartHtml}
  `;
}

/* ---------------------------- Root render ---------------------------- */
const TABS = [["stock", "Stock", "package"], ["precios", "Precios", "leaf"], ["ventas", "Ventas", "cart"], ["catalogo", "Catálogo", "image"], ["ganancias", "Ganancias", "trend"]];

function render() {
  const app = document.getElementById("app");
  let content = "";
  if (state.loading) {
    content = `<div style="display:flex;justify-content:center;padding:80px 0;color:var(--gold-soft);">Cargando…</div>`;
  } else if (state.tab === "stock") content = renderStockTab();
  else if (state.tab === "precios") content = renderPreciosTab();
  else if (state.tab === "ventas") content = renderVentasTab();
  else if (state.tab === "catalogo") content = renderCatalogoTab();
  else if (state.tab === "ganancias") content = renderGananciasTab();

  app.innerHTML = `
    <div class="header">
      ${seal(64, "sealHeader", "var(--gold)", "var(--cream)", "C")}
      <div><h1 class="serif">Cebamar Yerbas</h1><p>Panel del emprendedor</p></div>
    </div>
    ${!state.firebaseConnected ? `<div class="banner-error">${ICONS.alert} Firebase no está conectado — pegá tu firebaseConfig arriba en el archivo. Por ahora nada de lo que cargues se va a guardar.</div>` : ""}
    ${state.saveError ? `<div class="banner-error">${ICONS.alert} No se pudo guardar el último cambio. Probá de nuevo.</div>` : ""}
    <div class="tabs">
      ${TABS.map(([id, label, icon]) => `<button class="tab-btn ${state.tab === id ? "active" : ""}" data-action="set-tab" data-tab="${id}">${ICONS[icon]} ${label}</button>`).join("")}
    </div>
    <div id="tab-content">${content}</div>
    ${renderModal()}
  `;

  // live total for Ventas form
  const qtyEl = document.getElementById("sale-qty");
  const priceEl = document.getElementById("sale-price");
  const totalEl = document.getElementById("sale-total");
  if (qtyEl && priceEl && totalEl) {
    const updateTotal = () => { totalEl.textContent = money((Number(qtyEl.value) || 0) * (Number(priceEl.value) || 0)); };
    qtyEl.addEventListener("input", updateTotal);
    priceEl.addEventListener("input", updateTotal);
  }
  const saleProductSel = document.getElementById("sale-product");
  if (saleProductSel) {
    saleProductSel.addEventListener("change", (e) => { state.ui.saleProductId = e.target.value; render(); });
  }

  // live note preview for Catálogo (no full re-render, keeps focus)
  const noteInput = document.getElementById("catalog-note-input");
  const notePreview = document.getElementById("catalog-note-preview");
  if (noteInput && notePreview) {
    noteInput.addEventListener("input", (e) => {
      state.ui.catalogNote = e.target.value;
      notePreview.textContent = e.target.value;
      notePreview.style.display = e.target.value ? "block" : "none";
    });
  }
}

/* ---------------------------- Event delegation ---------------------------- */
document.addEventListener("DOMContentLoaded", async () => {
  // costo + ganancia % -> precio de venta (y viceversa), en la pestaña Precios y en el modal de producto
  document.getElementById("app").addEventListener("input", (e) => {
    const id = e.target.id;
    if (!id) return;
    let suffix, field;
    if (id === "pf-cost") { suffix = ""; field = "cost"; }
    else if (id === "pf-margin") { suffix = ""; field = "margin"; }
    else if (id === "pf-sale") { suffix = ""; field = "sale"; }
    else if (id.startsWith("cost-")) { suffix = id.slice(5); field = "cost"; }
    else if (id.startsWith("margin-")) { suffix = id.slice(7); field = "margin"; }
    else if (id.startsWith("sale-") && id !== "sale-product" && id !== "sale-qty") { suffix = id.slice(5); field = "sale"; }
    else return;

    const costEl = document.getElementById(suffix === "" ? "pf-cost" : `cost-${suffix}`);
    const marginEl = document.getElementById(suffix === "" ? "pf-margin" : `margin-${suffix}`);
    const saleEl = document.getElementById(suffix === "" ? "pf-sale" : `sale-${suffix}`);
    if (!costEl || !marginEl || !saleEl) return;
    const cost = Number(costEl.value) || 0;

    if (field === "cost" || field === "margin") {
      const margin = marginEl.value === "" ? null : Number(marginEl.value);
      if (cost > 0 && margin !== null && !isNaN(margin)) {
        saleEl.value = Math.round(cost * (1 + margin / 100));
      }
    } else if (field === "sale") {
      const sale = Number(saleEl.value) || 0;
      if (cost > 0 && sale > 0) marginEl.value = (((sale - cost) / cost) * 100).toFixed(1);
    }
  });

  document.getElementById("app").addEventListener("click", async (e) => {
    if (e.target.closest(".modal") && !e.target.closest("[data-action]")) return;
    const t = e.target.closest("[data-action]");
    if (!t) return;
    const action = t.dataset.action;
    const id = t.dataset.id;

    if (action === "set-tab") { state.tab = t.dataset.tab; render(); }

    else if (action === "open-new-product") { state.ui.modal = { mode: "new" }; render(); }
    else if (action === "edit-product") { const p = state.products.find((p) => p.id === id); state.ui.modal = { mode: "edit", product: p }; render(); }
    else if (action === "delete-product") { deleteProduct(id); }
    else if (action === "close-modal" || action === "close-modal-overlay") { state.ui.modal = null; render(); }

    else if (action === "save-product") {
      const name = document.getElementById("pf-name").value.trim();
      if (!name) return;
      const unit = document.getElementById("pf-unit").value;
      const costPrice = Number(document.getElementById("pf-cost").value) || 0;
      const salePrice = Number(document.getElementById("pf-sale").value) || 0;
      const isEdit = !!id;
      const stock = isEdit ? state.products.find((p) => p.id === id).stock : (Number(document.getElementById("pf-stock").value) || 0);
      upsertProduct({ id: isEdit ? id : uid(), name, unit, costPrice, salePrice, stock });
      state.ui.modal = null; render();
    }

    else if (action === "open-add-stock") { state.ui.addingStockFor = id; render(); }
    else if (action === "cancel-add-stock") { state.ui.addingStockFor = null; render(); }
    else if (action === "confirm-add-stock") {
      const input = document.getElementById(`stockqty-${id}`);
      const qty = Number(input.value);
      if (qty > 0) addStock(id, qty);
      state.ui.addingStockFor = null; render();
    }

    else if (action === "save-price") {
      const p = state.products.find((p) => p.id === id);
      const costPrice = Number(document.getElementById(`cost-${id}`).value) || 0;
      const salePrice = Number(document.getElementById(`sale-${id}`).value) || 0;
      upsertProduct({ ...p, costPrice, salePrice });
    }

    else if (action === "register-sale") {
      const errEl = document.getElementById("sale-error");
      errEl.textContent = "";
      const productId = document.getElementById("sale-product").value;
      const product = state.products.find((p) => p.id === productId);
      const qty = Number(document.getElementById("sale-qty").value);
      const unitPrice = Number(document.getElementById("sale-price").value) || 0;
      if (!product) { errEl.textContent = "Elegí un producto."; return; }
      if (!qty || qty <= 0) { errEl.textContent = "Ingresá una cantidad válida."; return; }
      if (qty > Number(product.stock)) { errEl.textContent = `Solo quedan ${numFmt(product.stock)} ${product.unit}.`; return; }
      registerSale({ productId, quantity: qty, unitPrice });
    }
    else if (action === "delete-sale") { deleteSale(id); }

    else if (action === "set-period") { state.ui.gananciasPeriod = t.dataset.period; render(); }

    else if (action === "remove-image") {
      const p = state.products.find((p) => p.id === id);
      if (p) upsertProduct({ ...p, image: null });
    }
    else if (action === "generate-catalog-image") { generateCatalogImage(); }
  });

  document.getElementById("app").addEventListener("change", async (e) => {
    const t = e.target.closest("[data-action]");
    if (!t) return;
    const action = t.dataset.action;
    const id = t.dataset.id;

    if (action === "upload-image") {
      const file = t.files && t.files[0];
      if (!file) return;
      try {
        const dataUrl = await compressImage(file);
        const p = state.products.find((p) => p.id === id);
        if (p) upsertProduct({ ...p, image: dataUrl });
      } catch {
        alert("No se pudo cargar la imagen. Probá con otra foto.");
      }
    }
    else if (action === "toggle-catalog-include") {
      const p = state.products.find((p) => p.id === id);
      if (p) upsertProduct({ ...p, inCatalog: t.checked });
    }
  });

  state.firebaseConnected = initFirebase();

  const p = await loadJSON(PRODUCTS_KEY, null);
  const s = await loadJSON(SALES_KEY, null);
  state.products = p || DEFAULT_PRODUCTS;
  state.sales = s || [];
  if (state.firebaseConnected) {
    if (!p) await saveJSON(PRODUCTS_KEY, state.products);
    if (!s) await saveJSON(SALES_KEY, state.sales);
  }
  state.loading = false;
  render();
});
</script>
</body>
</html>
